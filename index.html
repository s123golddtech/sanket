<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>InterviewPrep — Daily Revision Tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
<style>
:root{--bg:#f1f5f9;--card:#fff;--line:#e2e8f0;--text:#0f172a;--mut:#64748b;--acc:#4f46e5;--green:#16a34a;--amber:#d97706;--red:#dc2626;--dark:#0f172a}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Inter","Helvetica Neue",sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.45}
#app{display:flex;min-height:100vh}
/* ---------- Sidebar ---------- */
#sidebar{width:238px;background:var(--dark);color:#cbd5e1;position:fixed;inset:0 auto 0 0;height:100vh;display:flex;flex-direction:column;z-index:60;transition:transform .22s}
.brand{padding:18px 18px 14px;border-bottom:1px solid #1e293b}
.brand h2{color:#fff;font-size:17px;display:flex;gap:8px;align-items:center}
.brand .bs{font-size:11.5px;color:#94a3b8;margin-top:3px}
#nav{padding:10px 10px 0;overflow-y:auto;flex:1}
.navitem{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;color:#cbd5e1;font-size:14px;font-weight:600;cursor:pointer;user-select:none;margin-bottom:2px;text-decoration:none}
.navitem:hover{background:#1e293b;color:#fff}
.navitem.active{background:rgba(99,102,241,.22);color:#fff;box-shadow:inset 3px 0 0 #818cf8}
.side-foot{padding:12px 18px;border-top:1px solid #1e293b;font-size:11.5px;color:#94a3b8}
#overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:50;display:none}
#overlay.show{display:block}
/* ---------- Main ---------- */
#main{margin-left:238px;flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:11px 18px;display:flex;align-items:center;gap:12px;z-index:40}
#burger{display:none;border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;font-size:16px;cursor:pointer}
#topbar-title{font-weight:700;font-size:16.5px;display:flex;align-items:baseline;gap:10px;min-width:0}
.tb-date{font-weight:500;font-size:12.5px;color:var(--mut);white-space:nowrap}
.top-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.streak-chip,.timer-chip{background:#fff7ed;color:#c2410c;font-weight:700;font-size:12.5px;padding:5px 11px;border-radius:99px;border:1px solid #fed7aa;cursor:default;white-space:nowrap}
.timer-chip{background:#eef2ff;color:#4338ca;border-color:#c7d2fe;cursor:pointer;user-select:none}
#view{padding:20px 18px 60px;max-width:1100px;width:100%;margin:0 auto}
/* ---------- Cards / layout ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 1px 3px rgba(15,23,42,.05);margin-bottom:14px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.card-h h3{font-size:15.5px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.stat-row{margin-bottom:14px}
.stat{padding:14px}
.statlab{font-size:12px;color:var(--mut);font-weight:600}
.statnum{font-size:23px;font-weight:800;margin-top:2px}
.statsub{font-size:12px;color:var(--mut);margin-top:2px}
.page-head{margin-bottom:16px}
.page-head h1{font-size:24px}
.page-head .sub{color:var(--mut);font-size:13.5px;margin-top:2px}
.empty{color:var(--mut);font-size:13.5px;padding:10px 4px}
.mut{color:var(--mut)}.sm{font-size:12px}
/* ---------- progress ---------- */
.pbar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0}
.pbar.slim{height:7px;margin:6px 0 4px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,#6366f1,#8b5cf6);border-radius:99px;transition:width .35s}
.psmall{font-size:12.5px;color:var(--mut);font-weight:600}
.ring{--p:0;width:118px;height:118px;border-radius:50%;background:conic-gradient(#4f46e5 calc(var(--p)*1%),#e2e8f0 0);display:flex;align-items:center;justify-content:center;flex:none}
.ring>div{width:84px;height:84px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring b{font-size:22px}.ring span{font-size:11px;color:var(--mut)}
.hero{display:flex;gap:22px;flex-wrap:wrap;align-items:center}
.hero-l{flex:1;min-width:230px}
.bigpct{font-size:26px;font-weight:800}
.hcounts{font-size:13.5px;color:#334155;margin-top:4px}
.nowline{margin-top:8px;font-size:13.5px;color:var(--mut)}
.hero-r{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;min-width:250px;flex:1}
.mini{font-size:12px;color:var(--mut);font-weight:600}
.mini b{display:block;font-size:16px;color:var(--text)}
/* ---------- sessions & tasks ---------- */
.sess.cur{border-color:#a5b4fc;box-shadow:0 0 0 3px rgba(99,102,241,.12)}
.sess-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:4px}
.time-badge{font-variant-numeric:tabular-nums;background:#eef2ff;color:#4338ca;font-weight:700;padding:3px 9px;border-radius:8px;font-size:12px;white-space:nowrap}
.sess-label{font-weight:700;font-size:14.5px}
.sess-count{margin-left:auto;font-size:12.5px;color:var(--mut);font-weight:700;background:#f1f5f9;padding:2px 10px;border-radius:99px}
.now{background:#16a34a;color:#fff;font-size:10px;font-weight:800;padding:2px 7px;border-radius:99px;vertical-align:middle;margin-left:6px}
.sess-sub{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.chip{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:2.5px 9px;border-radius:99px;background:#f1f5f9;color:var(--mut);white-space:nowrap}
.chip.sc{cursor:pointer}
.chip.ok{background:#dcfce7;color:#15803d}.chip.bad{background:#fee2e2;color:#b91c1c}
.chip.warn,.chip.weak{background:#fef3c7;color:#b45309}.chip.over{background:#fee2e2;color:#b91c1c}.chip.pri{background:#e0e7ff;color:#4338ca}
.revdue{border-color:#fde68a}
.task{display:flex;align-items:flex-start;gap:10px;padding:7px 8px;border-radius:10px}
.task:hover{background:#f8fafc}
.task .tbody{flex:1;min-width:0}
.tt{font-size:14px;font-weight:500;word-wrap:break-word}
.task.done .tt{color:var(--mut);text-decoration:line-through}
.task.prog .tt{color:#92400e}
.tmeta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:3px}
.tnote{font-size:12.5px;color:var(--mut);margin-top:3px;white-space:pre-wrap}
.tacts{display:flex;gap:2px;opacity:0;transition:opacity .15s}
.task:hover .tacts,.tacts:focus-within{opacity:1}
@media(hover:none){.tacts{opacity:.7}}
.cb{width:23px;height:23px;flex:none;border:2px solid #94a3b8;border-radius:7px;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;color:#fff;padding:0;margin-top:1px}
.cb:hover{border-color:var(--acc)}
.cb.prog{border-color:var(--amber);background:#fef3c7;color:#b45309}
.cb.done{border-color:var(--green);background:var(--green)}
.pdot{width:9px;height:9px;border-radius:50%;display:inline-block}
.pdot.high{background:var(--red)}.pdot.med{background:#eab308}.pdot.low{background:#22c55e}
.ibtn{border:none;background:transparent;cursor:pointer;font-size:14px;padding:3px 7px;border-radius:7px;color:var(--mut)}
.ibtn:hover{background:#eef2ff;color:var(--acc)}
/* ---------- buttons / forms ---------- */
.btn{border:1px solid var(--line);background:#fff;color:var(--text);padding:7px 14px;border-radius:9px;font-size:13.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-family:inherit}
.btn:hover{border-color:#cbd5e1;background:#f8fafc}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}.btn.primary:hover{background:#4338ca}
.btn.danger{color:var(--red);border-color:#fecaca}.btn.danger:hover{background:#fef2f2}
.btn.warn{color:var(--amber);border-color:#fde68a}
.btn.ghost{border-color:transparent;background:transparent;color:var(--acc)}.btn.ghost:hover{background:#eef2ff}
.btn.sm{padding:4px 11px;font-size:12.5px;border-radius:8px}
.in{width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:9px;font-size:14px;font-family:inherit;background:#fff;color:var(--text)}
.in:focus{outline:2px solid #c7d2fe;border-color:var(--acc)}
textarea.in{resize:vertical}
.f{display:flex;flex-direction:column;gap:5px;flex:1;min-width:120px}
.f label{font-size:12px;font-weight:700;color:#475569}
.row2{display:flex;gap:12px;flex-wrap:wrap}.row3{display:flex;gap:12px;flex-wrap:wrap}
.ck{display:flex;gap:8px;align-items:center;font-size:13.5px;margin:10px 0;cursor:pointer}
/* ---------- filter bar / tabs ---------- */
.filterbar .chips-row{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;padding:6px 0 4px;margin-top:8px}
.fchip{white-space:nowrap;border:1px solid var(--line);background:#fff;padding:4px 12px;border-radius:99px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--mut)}
.fchip.on{background:var(--dark);color:#fff;border-color:var(--dark)}
.tabbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}
.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;padding:6px 13px;border-radius:99px;font-size:13px;font-weight:600;cursor:pointer;color:var(--mut)}
.tab.on{background:var(--dark);color:#fff;border-color:var(--dark)}
/* ---------- topic grids / tables / misc ---------- */
.topics-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px 16px}
.topics-grid .task{padding:5px 6px}
.tblwrap{overflow-x:auto;margin-top:6px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.4px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid #f1f5f9;vertical-align:top}
.qtext{background:#f8fafc;border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:10px;padding:12px 14px;font-size:15px;font-weight:600;margin:8px 0}
.iq{border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin-bottom:9px}
.iq.good{border-color:#bbf7d0;background:#f0fdf4}
.iq.fail{border-color:#fecaca;background:#fef2f2}
.iq-m{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:5px}
.iq-a{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.accrow{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:13.5px}
.accrow .pbar{flex:1;margin:0}
.uprow{display:flex;align-items:center;gap:9px;padding:6px 2px;font-size:13.5px;flex-wrap:wrap}
.hm{display:grid;grid-template-columns:repeat(15,1fr);gap:4px;margin-top:10px}
.hmc{height:20px;border-radius:5px;background:#e2e8f0}
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:8px}
.kv b{display:block;font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.3px;margin-bottom:2px}
.kv{font-size:13.5px}
.sess-edit{border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:12px}
.chips-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.sub-chip{--c:#64748b;border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:600;background:#fff;color:var(--mut);cursor:pointer;font-family:inherit}
.sub-chip.on{background:var(--c);border-color:var(--c);color:#fff}
.banner{background:linear-gradient(90deg,#eef2ff,#fdf4ff);border:1px solid #c7d2fe}
/* ---------- modal / toast ---------- */
.backdrop{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:24px 14px;overflow-y:auto}
.modal{background:#fff;border-radius:16px;max-width:600px;width:100%;padding:20px;box-shadow:0 20px 60px rgba(15,23,42,.3);margin:auto}
.modal h3{margin-bottom:14px}
.mbtns{display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--dark);color:#fff;padding:10px 18px;border-radius:99px;font-size:13.5px;font-weight:600;opacity:0;transition:all .25s;z-index:99;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* ---------- responsive ---------- */
@media(max-width:960px){
#sidebar{transform:translateX(-100%)}
#sidebar.open{transform:none}
#main{margin-left:0}
#burger{display:block}
.g4{grid-template-columns:1fr 1fr}
.topics-grid{grid-template-columns:1fr}
}
@media(max-width:560px){
.g2,.g3,.g4{grid-template-columns:1fr 1fr}
#view{padding:14px 10px 70px}
.sess-count{margin-left:0}
.hero{gap:14px}
}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand"><h2>🎯 InterviewPrep</h2><div class="bs">Daily execution · revision · tracking</div></div>
    <nav id="nav"></nav>
    <div class="side-foot" id="side-prog"></div>
  </aside>
  <div id="overlay" onclick="toggleSidebar()"></div>
  <main id="main">
    <header id="topbar">
      <button id="burger" onclick="toggleSidebar()">☰</button>
      <div id="topbar-title"></div>
      <div class="top-right">
        <div class="timer-chip" id="tb-timer" onclick="toggleTimer()" title="Study timer">▶ 0m</div>
        <div class="streak-chip" id="tb-streak">🔥 0</div>
      </div>
    </header>
    <div id="view"></div>
  </main>
</div>
<div id="modal-root"></div>
<div id="toast-root"></div>

<script>
/* =====================================================================
   1. UTILITIES
===================================================================== */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const KEY='interviewPrep_v1';
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function uid(){return Math.random().toString(36).slice(2,10);}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function parseDate(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function addDays(s,n){const d=parseDate(s);d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function dayNum(s){return Math.round(parseDate(s).getTime()/86400000);}
function niceDate(s){return parseDate(s).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});}
function longDate(s){return parseDate(s).toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'});}
function nowMin(){const d=new Date();return d.getHours()*60+d.getMinutes();}
function fmtMin(m){let h=Math.floor(m/60)%24,mm=m%60;const ap=h>=12?'PM':'AM';h=h%12||12;return h+':'+String(mm).padStart(2,'0')+' '+ap;}
function minToInput(m){const h=Math.floor(m/60)%24,mm=m%60;return String(h).padStart(2,'0')+':'+String(mm).padStart(2,'0');}
function parseTime(v){if(!v)return 0;const[a,b]=v.split(':').map(Number);return (a||0)*60+(b||0);}
function fmtSec(s){s=Math.max(0,Math.floor(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?h+'h '+m+'m':m+'m';}
function lastNDays(n){return[...Array(n)].map((_,i)=>addDays(todayStr(),-(n-1-i)));}
function weekDates(){const t=parseDate(todayStr());const dow=(t.getDay()+6)%7;const mon=addDays(todayStr(),-dow);return[...Array(7)].map((_,i)=>addDays(mon,i));}
function toast(msg){const el=document.createElement('div');el.className='toast';el.textContent=msg;$('#toast-root').appendChild(el);setTimeout(()=>el.classList.add('show'),10);setTimeout(()=>{el.classList.remove('show');setTimeout(()=>el.remove(),300);},2800);}
function openModal(html){$('#modal-root').innerHTML='<div class="backdrop" onclick="if(event.target===this)closeModal()"><div class="modal">'+html+'</div></div>';}
function closeModal(){$('#modal-root').innerHTML='';}
function stat(lab,val,sub){return '<div class="card stat"><div class="statlab">'+lab+'</div><div class="statnum">'+val+'</div>'+(sub?'<div class="statsub">'+sub+'</div>':'')+'</div>';}
function pageHead(t,s){return '<div class="page-head"><h1>'+t+'</h1>'+(s?'<div class="sub">'+s+'</div>':'')+'</div>';}
function chip(subj){return '<span class="chip" style="background:'+subj.color+'1a;color:'+subj.color+'">'+subj.name+'</span>';}

/* =====================================================================
   2. CONSTANTS — subjects, topic lists, schedule, question pools
===================================================================== */
const STAGES=[1,3,7,14,30];
const DEFAULT_SCHEDULE=[
 {id:'s1',start:600,end:720,label:'DSA + LeetCode',subjects:['dsa']},
 {id:'s2',start:780,end:900,label:'Java / OOP / Spring Boot',subjects:['java','git']},
 {id:'s3',start:900,end:1020,label:'AWS + Linux + Networking + OS',subjects:['aws','linux','networks','os']},
 {id:'s4',start:1050,end:1140,label:'Aptitude',subjects:['aptitude']},
 {id:'s5',start:1140,end:1230,label:'SQL + DBMS + SE + Testing',subjects:['sql','se','testing']},
 {id:'s6',start:1290,end:1350,label:'Project Revision',subjects:['projects','sysdesign']},
 {id:'s7',start:1350,end:1395,label:'Communication + HR + Interview',subjects:['communication','interview']},
 {id:'s8',start:1395,end:1440,label:'Daily Revision + Mistake Review',subjects:['revision']}
];
const SUBJECTS={
 dsa:{name:'DSA',color:'#6366f1',page:'dsa',tpd:2,
  lists:[{id:'c',name:'DSA Concepts',topics:['Arrays','Strings','Linked List','Stack','Queue','HashMap / HashSet','Recursion','Backtracking','Binary Search','Sorting','Sliding Window','Two Pointer','Prefix Sum','Greedy','Trees','BST','Heap / Priority Queue','Graph','BFS','DFS','Dynamic Programming','Trie']}],
  daily:[{k:'easy',f:s=>'Solve '+(s.dailyTargets.easy||1)+' Easy LeetCode problem'+((s.dailyTargets.easy||1)>1?'s':'')},
   {k:'medium',f:s=>'Solve '+(s.dailyTargets.medium||1)+' Medium LeetCode problem'+((s.dailyTargets.medium||1)>1?'s':'')},
   {k:'revise',t:'Revise one previously solved problem'},
   {t:'Analyze time & space complexity of today\u2019s problems'},
   {t:'Write the approach first — without looking at solutions'}]},
 java:{name:'Java',color:'#d97706',page:'java',tpd:3,
  lists:[
   {id:'core',name:'Core Java',topics:['Variables & Data Types','Operators','Loops','Methods','Arrays','Strings','StringBuilder / StringBuffer','Exception Handling','Collections Framework','List','Set','Map','Queue','Stack','Generics','File Handling','Java 8 Features','Lambda Expressions','Streams','Functional Interfaces','Multithreading','Threads','Synchronization','JVM / JDK / JRE','Garbage Collection']},
   {id:'oop',name:'OOP',topics:['Class & Object','Encapsulation','Inheritance','Polymorphism','Abstraction','Interface','Abstract Class','Method Overloading','Method Overriding','Constructor','final / static / this / super']},
   {id:'spring',name:'Spring Boot / REST API',topics:['Spring Boot basics & starters','@RestController & request mapping','Dependency Injection','REST API design & CRUD','Spring Data JPA basics','Validation','Global exception handling (@ControllerAdvice)','Spring Security & JWT basics','Profiles & application.properties','Actuator & health checks','Microservices basics']}],
  daily:[{t:'Revise 5 Java interview questions'},{t:'Explain one Java concept verbally'},{t:'Write one Java coding problem without assistance'},{t:'Revise 3 Spring Boot / REST API concepts'}]},
 aws:{name:'AWS / Cloud',color:'#f97316',page:'aws',tpd:1,
  lists:[{id:'c',name:'AWS Services & Concepts',topics:['AWS Regions & Availability Zones','IAM','EC2','AMI','Security Groups','S3','EBS','VPC','Subnets','Internet Gateway','Load Balancer','Auto Scaling','RDS','CloudWatch','Lambda basics','Route 53 basics','AWS CLI basics']}],
  daily:[{t:'Revise 3 AWS concepts'},{t:'Answer 5 AWS interview questions'},{t:'Explain one AWS architecture verbally (EC2 + ALB + ASG + RDS)'}]},
 aptitude:{name:'Aptitude',color:'#eab308',page:'aptitude',tpd:1,
  lists:[
   {id:'q',name:'Quantitative Aptitude',topics:['Percentages','Profit & Loss','Ratio & Proportion','Average','Time & Work','Time Speed Distance','Simple Interest','Compound Interest','Probability','Permutation & Combination','Number System','LCM / HCF','Ages','Mixtures','Data Interpretation']},
   {id:'l',name:'Logical Reasoning',topics:['Series','Coding-Decoding','Blood Relations','Direction Sense','Seating Arrangement','Syllogism','Puzzles','Statement & Conclusion','Data Sufficiency']},

/* =====================================================================
   3. STATE (persisted in localStorage)
===================================================================== */
let state;
function defaultState(){return{version:1,meta:{welcomed:false},
 settings:{name:'',streakThreshold:0.5,weakTopicsPerDay:2,schedule:JSON.parse(JSON.stringify(DEFAULT_SCHEDULE)),
  dailyTargets:{easy:1,medium:1,quant:15,logical:10,verbal:10,techQ:5,projectQ:2,hrQ:2,sqlQ:3}},
 days:{},topicStatus:{},revisionQueue:[],weakTopics:[],dsaProblems:[],projects:[],
 interviewLog:[],interviewRotation:{},commAnswers:[],mustKnow:{},
 timer:{running:false,startAt:null,date:null}};}
function load(){try{const raw=localStorage.getItem(KEY);
 if(raw){const d=JSON.parse(raw);const def=defaultState();state=Object.assign(def,d);
  state.settings=Object.assign(defaultState().settings,d.settings||{});
  state.meta=Object.assign({welcomed:false},d.meta||{});}
 else state=defaultState();
}catch(e){state=defaultState();}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}

function mkTask(o){return Object.assign({id:uid(),type:'daily',kind:null,title:'',subject:null,session:'',status:'todo',priority:'med',notes:'',topicKey:null,weakId:null},o);}

/* =====================================================================
   4. DAILY GENERATION (checklist + rotating interview questions)
===================================================================== */
function pickTopics(sid,D){const subj=SUBJECTS[sid];const all=[];
 subj.lists.forEach(l=>l.topics.forEach((t,i)=>{const key=sid+':'+l.id+':'+i;
  if(((state.topicStatus[key]||{}).status||'todo')!=='done')all.push({title:t,key:key});}));
 if(!all.length)return[];
 const n=Math.min(subj.tpd||1,all.length),st=dayNum(D)%all.length,out=[];
 for(let k=0;k<n;k++)out.push(all[(st+k)%all.length]);
 return out;}

function generateDayTasks(D){
 const s=state.settings,tasks=[],dn=dayNum(D);
 s.schedule.forEach(sess=>{(sess.subjects||[]).forEach(sid=>{const subj=SUBJECTS[sid];if(!subj)return;
  (subj.daily||[]).forEach(it=>{const title=it.f?it.f(s):(it.t||'');
   tasks.push(mkTask({type:'daily',kind:it.k||null,title:title,subject:sid,session:sess.id}));});
  if(subj.lists&&subj.lists.length)pickTopics(sid,D).forEach(tp=>
   tasks.push(mkTask({type:'topic',title:tp.title,subject:sid,session:sess.id,topicKey:tp.key})));});});
 // bring weak topics back into the day (rotating, if not practiced in last 3 days)
 const wl=state.weakTopics.filter(w=>!w.resolved&&(!w.lastPracticed||dn-dayNum(w.lastPracticed)>=3));
 if(wl.length){const st=dn%wl.length,n=Math.min(s.weakTopicsPerDay||2,wl.length);
  for(let k=0;k<n;k++){const w=wl[(st+k)%wl.length];
   const sess=s.schedule.find(x=>x.subjects&&x.subjects.includes(w.subject))||s.schedule[s.schedule.length-1];
   tasks.push(mkTask({type:'weak',title:'Focus (weak): '+w.topic,subject:w.subject||'revision',session:sess?sess.id:'',weakId:w.id}));}}
 return tasks;}

function nextQ(cat){const pool=POOL[cat]||[];if(!pool.length)return '—';
 let r=state.interviewRotation[cat];
 if(!r||r.ptr>=r.order.length){r={order:shuffle(pool.map((_,i)=>i)),ptr:0};state.interviewRotation[cat]=r;}
 return pool[r.order[r.ptr++]];}

function generateDayInterview(D,day){day=day||state.days[D];if(!day)return;
 if(day.interview&&day.interview.length)return;
 const tg=state.settings.dailyTargets,dn=dayNum(D),items=[];
 for(let k=0;k<Math.max(1,tg.techQ||5);k++){const cat=TECH_CATS[(dn*2+k)%TECH_CATS.length];
  items.push({id:uid(),cat:cat,text:nextQ(cat),status:'todo',answer:''});}
 for(let k=0;k<Math.max(0,tg.projectQ||2);k++)items.push({id:uid(),cat:'project',text:nextQ('project'),status:'todo',answer:''});
 for(let k=0;k<Math.max(0,tg.hrQ||2);k++)items.push({id:uid(),cat:'hr',text:nextQ('hr'),status:'todo',answer:''});
 day.interview=items;}

function getDay(D){let day=state.days[D];
 if(!day){day={tasks:generateDayTasks(D),aptitude:null,review:null,interview:[],studySeconds:0};state.days[D]=day;}
 if(!day.interview)generateDayInterview(D,day);
 return day;}

/* =====================================================================
   5. STATS — day / streak / weekly / monthly
===================================================================== */
function dueRevisions(){const t=dayNum(todayStr());
 return state.revisionQueue.filter(q=>!q.done&&dayNum(q.dueDate)<=t).sort((a,b)=>a.dueDate<b.dueDate?-1:1);}
function dayStats(D){const dd=state.days[D];let total=0,done=0;
 if(dd){total=dd.tasks.length;done=dd.tasks.filter(t=>t.status==='done').length;}
 const rv=state.revisionQueue.filter(q=>q.lastCompleted===D).length;total+=rv;done+=rv;
 if(D===todayStr())total+=dueRevisions().length;
 return{total:total,done:done,remaining:Math.max(0,total-done),pct:total?Math.round(done/total*100):0};}
function qualifiesDay(D){const st=dayStats(D);return st.total>=5&&st.done/st.total>=state.settings.streakThreshold;}
function currentStreak(){let n=0,d=todayStr();
 if(!qualifiesDay(d))d=addDays(d,-1);
 while(qualifiesDay(d)){n++;d=addDays(d,-1);}return n;}
function bestStreak(){const dates=Object.keys(state.days).filter(qualifiesDay).sort();
 let best=0,run=0,prev=null;
 for(const d of dates){run=(prev&&dayNum(d)===dayNum(prev)+1)?run+1:1;best=Math.max(best,run);prev=d;}
 return Math.max(best,currentStreak());}
function periodCompletion(n){let t=0,d=0;lastNDays(n).forEach(D=>{const st=dayStats(D);t+=st.total;d+=st.done;});
 return{done:d,total:t,pct:t?Math.round(d/t*100):0};}
function subjectProgress(subj){let total=0,done=0;
 subj.lists.forEach(l=>{total+=l.topics.length;l.topics.forEach((_,i)=>{
  if(((state.topicStatus[subj.id+':'+l.id+':'+i]||{}).status||'todo')==='done')done++;});});
 return{total:total,done:done,pct:total?Math.round(done/total*100):0};}
function weeklyReview(){const dates=weekDates();let tasksDone=0,tasksTotal=0,studySec=0;const subjStat={};
 dates.forEach(D=>{const dd=state.days[D];if(!dd)return;studySec+=dd.studySeconds||0;
  dd.tasks.forEach(t=>{tasksTotal++;if(t.status==='done')tasksDone++;
   const s=t.subject||'other';(subjStat[s]=subjStat[s]||{d:0,t:0}).t++;if(t.status==='done')subjStat[s].d++;});});
 const probs=state.dsaProblems.filter(p=>dates.includes(p.date)).length;
 let aptA=0,aptC=0;
 dates.forEach(D=>{const a=(state.days[D]||{}).aptitude;if(a)['quant','logical','verbal'].forEach(k=>{aptA+=(a[k]&&a[k].att)||0;aptC+=(a[k]&&a[k].cor)||0;});});
 const iqs=state.interviewLog.filter(l=>dates.includes(l.date)).length;
 const comm=state.commAnswers.filter(c=>dates.includes(c.date)).length;
 const revs=state.revisionQueue.filter(q=>dates.includes(q.lastCompleted)).length;
 const topics=Object.values(state.topicStatus).filter(v=>v.status==='done'&&dates.includes(v.date)).length;
 const strong=[],weak=[];
 Object.entries(subjStat).forEach(([s,st])=>{if(st.t<3)return;const pct=st.d/st.t;
  const nm=(SUBJECTS[s]||{}).name||s;
  if(pct>=0.8)strong.push(nm);else if(pct<0.5)weak.push(nm+' ('+Math.round(pct*100)+'%)');});
 const nextWeek=[...new Set([...state.weakTopics.filter(w=>!w.resolved).map(w=>w.topic),
  ...dueRevisions().slice(0,8).map(q=>q.topic)])].slice(0,12);
 return{tasksDone:tasksDone,tasksTotal:tasksTotal,probs:probs,aptA:aptA,aptC:aptC,iqs:iqs,comm:comm,revs:revs,topics:topics,studySec:studySec,strong:strong,weak:weak,nextWeek:nextWeek};}

/* =====================================================================
   6. REVISION QUEUE & WEAK TOPICS (spaced repetition)
===================================================================== */
function enqueueRevision(subject,topic,key){
 if(key&&state.revisionQueue.some(q=>!q.done&&q.key===key))return;
 state.revisionQueue.push({id:uid(),subject:subject||'revision',topic:topic,key:key||('k:'+uid()),stage:0,dueDate:addDays(todayStr(),STAGES[0]),created:todayStr(),lastCompleted:null,done:false});}
function setQueueFor(key,subject,topic,date){let q=state.revisionQueue.find(x=>!x.done&&x.key===key);
 if(!date){if(q)state.revisionQueue=state.revisionQueue.filter(x=>x!==q);return;}
 if(q)q.dueDate=date;else state.revisionQueue.push({id:uid(),subject:subject||'revision',topic:topic,key:key,stage:0,dueDate:date,created:todayStr(),lastCompleted:null,done:false});}
function dequeue(key){state.revisionQueue=state.revisionQueue.filter(q=>q.done||q.key!==key);}
function completeRevision(id){const q=state.revisionQueue.find(x=>x.id===id);if(!q)return;
 q.lastCompleted=todayStr();q.stage=(q.stage||0)+1;
 if(q.stage>=STAGES.length){q.done=true;toast('🎉 Mastered: '+q.topic+' (all 5 revisions complete)');}
 else{q.dueDate=addDays(todayStr(),STAGES[q.stage]);toast('🔁 '+q.topic+' — next revision '+niceDate(q.dueDate));}
 save();render();}
function snoozeRevision(id){const q=state.revisionQueue.find(x=>x.id===id);if(!q)return;
 q.dueDate=addDays(todayStr(),1);save();render();toast('⏭ Moved to tomorrow');}
function addWeak(subject,topic,reason){
 if(state.weakTopics.some(w=>!w.resolved&&w.topic===topic))return false;
 state.weakTopics.push({id:uid(),subject:subject||'revision',topic:topic,reason:reason||'',addedDate:todayStr(),hits:0,lastPracticed:null,resolved:false});
 return true;}
function resolveWeak(id){const w=state.weakTopics.find(x=>x.id===id);if(!w)return;
 w.resolved=true;save();render();toast('✅ Weak topic resolved — great job!');}
function weakSubjects(){return[...new Set(state.weakTopics.filter(w=>!w.resolved).map(w=>w.subject))];}

/* =====================================================================
   7. TASK ACTIONS (tri-state, add/edit/delete/move, priorities, notes)
===================================================================== */
function findTask(id){for(const ds in state.days){const t=state.days[ds].tasks.find(t=>t.id===id);if(t)return{date:ds,t:t};}return null;}
function topicFromKey(key){const p=key.split(':');const subj=SUBJECTS[p[0]];const list=subj.lists.find(l=>l.id===p[1]);
 return{subj:subj,list:list,i:+p[2],title:list.topics[+p[2]]};}
function onTaskDone(date,t){
 if(t.type==='topic'&&t.topicKey){const tf=topicFromKey(t.topicKey);
  const cur=(state.topicStatus[t.topicKey]||{}).status||'todo';
  if(cur!=='done'){state.topicStatus[t.topicKey]={status:'done',date:date};
   enqueueRevision(t.subject,tf.title,t.topicKey);
   toast('✅ '+tf.title+' — revisions scheduled (1, 3, 7, 14, 30 days)');}}
 if(t.type==='weak'&&t.weakId){const w=state.weakTopics.find(x=>x.id===t.weakId);
  if(w){w.hits=(w.hits||0)+1;w.lastPracticed=date;}}}
function onTaskUndone(t){
 if(t.type==='topic'&&t.topicKey){const cur=state.topicStatus[t.topicKey];
  if(cur&&cur.status==='done'){state.topicStatus[t.topicKey]={status:'prog'};dequeue(t.topicKey);}}}
function setTaskStatus(date,t,st){const prev=t.status;t.status=st;
 if(st==='done'&&prev!=='done')onTaskDone(date,t);
 else if(prev==='done'&&st!=='done')onTaskUndone(t);
 save();render();}
function cycleTask(id,e){if(e)e.stopPropagation();const f=findTask(id);if(!f)return;
 const order=['todo','prog','done'];const nx=order[(order.indexOf(f.t.status)+1)%3];
 setTaskStatus(f.date,f.t,nx);}
function deleteTask(id){const f=findTask(id);if(!f)return;
 if(!confirm('Delete this task?'))return;
 state.days[f.date].tasks=state.days[f.date].tasks.filter(t=>t.id!==id);
 setQueueFor('task:'+id,null,'','');
 save();render();}
function cycleTopic(key){const cur=(state.topicStatus[key]||{}).status||'todo';
 if(cur==='todo')state.topicStatus[key]={status:'prog'};
 else if(cur==='prog'){state.topicStatus[key]={status:'done',date:todayStr()};
  const tf=topicFromKey(key);enqueueRevision(tf.subj.id,tf.title,key);toast('✅ '+tf.title+' — revisions scheduled');

function taskRow(t){const subj=t.subject?SUBJECTS[t.subject]:null;
 const pd=t.priority==='high'?'<span class="pdot high" title="High priority"></span>':t.priority==='low'?'<span class="pdot low" title="Low priority"></span>':'<span class="pdot med" title="Medium priority"></span>';
 return '<div class="task '+t.status+'">'
 +'<button class="cb '+t.status+'" onclick="cycleTask(\''+t.id+'\',event)" title="Not started → In progress → Completed">'+(t.status==='done'?'✓':t.status==='prog'?'✎':'')+'</button>'
 +'<div class="tbody"><div class="tt">'+esc(t.title)
 +(t.type==='priority'?' <span class="chip pri">⭐ priority</span>':'')
 +(t.type==='weak'?' <span class="chip weak">weak</span>':'')+'</div>'
 +'<div class="tmeta">'+(subj?chip(subj):'')+pd
 +(t.kind==='dailyrev'?' <span class="chip">review</span>':'')+'</div>'
 +(t.notes?'<div class="tnote">'+esc(t.notes)+'</div>':'')+'</div>'
 +'<div class="tacts"><button class="ibtn" title="Edit" onclick="openTaskModal(\''+t.id+'\')">✎</button>'
 +'<button class="ibtn" title="Delete" onclick="deleteTask(\''+t.id+'\')">✕</button></div></div>';}
function topicRow(subjId,listId,i,title){const key=subjId+':'+listId+':'+i;
 const st=(state.topicStatus[key]||{}).status||'todo';
 const q=state.revisionQueue.find(x=>!x.done&&x.key===key);
 const doneAt=st==='done'&&state.topicStatus[key]?state.topicStatus[key].date:null;
 return '<div class="task '+st+'">'
 +'<button class="cb '+st+'" onclick="cycleTopic(\''+key+'\')" title="Not started → In progress → Completed">'+(st==='done'?'✓':st==='prog'?'✎':'')+'</button>'
 +'<div class="tbody"><div class="tt">'+esc(title)+'</div>'
 +'<div class="tmeta">'+(doneAt?'<span class="chip ok">done '+niceDate(doneAt)+'</span>':'')
 +(q?'<span class="chip">🔄 next '+niceDate(q.dueDate)+'</span>':'')+'</div></div></div>';}
function listCard(subj,list){const total=list.topics.length;let done=0;
 list.topics.forEach((_,i)=>{if(((state.topicStatus[subj.id+':'+list.id+':'+i]||{}).status||'todo')==='done')done++;});
 const pct=total?Math.round(done/total*100):0;
 return '<div class="card"><div class="card-h"><h3>'+esc(list.name)+'</h3><span class="psmall">'+done+'/'+total+' · '+pct+'%</span></div>'
 +'<div class="pbar slim"><i style="width:'+pct+'%"></i></div>'
 +'<div class="topics-grid">'+list.topics.map((t,i)=>topicRow(subj.id,list.id,i,t)).join('')+'</div></div>';}
function revisionRow(q){const subj=SUBJECTS[q.subject];const over=dayNum(q.dueDate)<dayNum(todayStr());
 return '<div class="task"><button class="cb todo" title="Mark revised" onclick="completeRevision(\''+q.id+'\')"></button>'
 +'<div class="tbody"><div class="tt">🔄 '+esc(q.topic)+'</div>'
 +'<div class="tmeta">'+(subj?chip(subj):'')+'<span class="chip">rev '+(q.stage+1)+'/5</span>'
 +(over?'<span class="chip over">overdue</span>':'')+'</div></div>'
 +'<div class="tacts"><button class="ibtn" title="Postpone to tomorrow" onclick="snoozeRevision(\''+q.id+'\')">⏭</button></div></div>';}
function nowLineHTML(){const si=sessionInfo();
 if(si.cur)return '<b>Now:</b> '+fmtMin(si.cur.start)+'–'+fmtMin(si.cur.end)+' · '+esc(si.cur.label);
 if(si.next)return '<b>Now:</b> Break / free time — next session '+fmtMin(si.next.start)+' ('+esc(si.next.label)+')';
 return 'All sessions done — time to rest 🌙';}
function sessionInfo(){const m=nowMin();
 const sc=[...state.settings.schedule].sort((a,b)=>a.start-b.start);
 return{cur:sc.find(s=>s.start<=m&&m<s.end),next:sc.find(s=>s.start>m)};}
function sessionCard(s,tasks,noTime){const done=tasks.filter(t=>t.status==='done').length;
 const cur=!noTime&&s.start!=null&&s.start<=nowMin()&&nowMin()<s.end;
 const subs=[...new Set(tasks.map(t=>t.subject).filter(Boolean))];
 const chips=subs.map(sid=>{const sj=SUBJECTS[sid];return sj?'<span class="chip sc" style="background:'+sj.color+'1a;color:'+sj.color+'" onclick="navigate(\''+sj.page+'\')">'+sj.name+'</span>':'';}).join('');
 const links=[];
 if(subs.includes('interview'))links.push('<button class="btn sm ghost" onclick="navigate(\'interview\')">🎤 Interview Mode</button>');
 if(subs.includes('communication'))links.push('<button class="btn sm ghost" onclick="navigate(\'communication\')">💬 Speaking Mode</button>');
 if(subs.includes('projects'))links.push('<button class="btn sm ghost" onclick="navigate(\'projects\')">💼 Project Interview Mode</button>');
 if(subs.includes('revision'))links.push('<button class="btn sm ghost" onclick="navigate(\'revision\')">📝 End-of-day review</button>');
 if(subs.includes('dsa'))links.push('<button class="btn sm ghost" onclick="openProblemModal()">➕ Log DSA problem</button>');
 return '<div class="card sess'+(cur?' cur':'')+'">'
 +'<div class="sess-head">'+(noTime?'':'<span class="time-badge">'+fmtMin(s.start)+' – '+fmtMin(s.end)+'</span>')
 +'<span class="sess-label">'+esc(s.label)+(cur?'<span class="now">NOW</span>':'')+'</span>'
 +'<span class="sess-count">'+done+'/'+tasks.length+'</span>'
 +'<button class="btn sm ghost" onclick="openTaskModal(null,\''+(s.id||'')+'\')">＋ Add</button></div>'
 +(chips||links.length?'<div class="sess-sub">'+chips+links.join('')+'</div>':'')
 +(tasks.length?tasks.map(taskRow).join(''):'<div class="empty">No tasks here — add one above.</div>')+'</div>';}

function setTodayFilter(k){todayFilter.f=k;render();}
function onTodaySearch(v){todayFilter.q=v;const el=$('#taskArea');if(el)el.innerHTML=taskAreaHTML();}
function taskAreaHTML(){const D=todayStr();const day=getDay(D);const f=todayFilter;
 const q=f.q.toLowerCase();const weakSubs=weakSubjects();
 const match=t=>{
  if(q&&!(t.title.toLowerCase().includes(q)||(t.notes||'').toLowerCase().includes(q)))return false;
  if(f.subj!=='all'&&(t.subject||'other')!==f.subj)return false;
  if(f.pri!=='all'&&(t.priority||'med')!==f.pri)return false;
  if(f.f==='pending'&&t.status==='done')return false;
  if(f.f==='completed'&&t.status!=='done')return false;
  if(f.f==='weak'&&t.type!=='weak'&&!weakSubs.includes(t.subject))return false;
  return true;};
 const filtering=q||f.f!=='all'||f.subj!=='all'||f.pri!=='all';
 let h='';
 if(f.f==='all'||f.f==='pending'||f.f==='due'){
  let due=dueRevisions();
  if(q)due=due.filter(r=>r.topic.toLowerCase().includes(q));
  if(f.subj!=='all')due=due.filter(r=>r.subject===f.subj);
  if(due.length)h+='<div class="card revdue"><div class="sess-head"><span class="sess-label">🔄 Due for Revision</span>'
  +'<span class="sess-count">'+due.length+'</span></div>'+due.map(revisionRow).join('')+'</div>';}
 state.settings.schedule.forEach(s=>{
  const ts=day.tasks.filter(t=>t.session===s.id&&match(t));
  if(filtering&&!ts.length)return;
  h+=sessionCard(s,ts);});
 const other=day.tasks.filter(t=>!t.session&&match(t));
 if(other.length||!filtering)h+=sessionCard({id:'',label:'Other tasks',start:null},other,true);
 if(filtering&&!h)h='<div class="card"><div class="empty">No tasks match this filter.</div></div>';
 return h;}
function regenerateDay(){if(!confirm('Regenerate today\u2019s checklist?\n\nCompletions & custom tasks for today will be reset. Logs, notes and review answers are kept.'))return;
 const day=getDay(todayStr());day.tasks=generateDayTasks(todayStr());
 save();render();toast('✅ Today\u2019s checklist regenerated');}

function draftDelSess(id){schedDraft=schedDraft.filter(s=>s.id!==id);render();}
function discardSchedule(){schedDraft=null;render();}
function saveSchedule(){const out=[];
 $$('.sess-edit').forEach(r=>{const label=r.querySelector('.s-label').value.trim()||'Session';
  let start=parseTime(r.querySelector('.s-start').value)||600;
  let end=parseTime(r.querySelector('.s-end').value);if(end===0)end=1440;
  if(end<=start){end=Math.min(1440,start+60);toast('⚠ A session was shorter than 1 hour — adjusted');}
  const subjects=[...r.querySelectorAll('.sub-chip.on')].map(c=>c.textContent);
  out.push({id:r.dataset.id||uid(),start:start,end:end,label:label,subjects:subjects});});
 out.sort((a,b)=>a.start-b.start);
 state.settings.schedule=out;schedDraft=null;save();render();
 toast('🕒 Schedule saved — use “Regenerate” on Today to apply');}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);
 a.download='interview-prep-backup-'+todayStr()+'.json';a.click();toast('⬇ Backup downloaded');}
function importData(ev){const f=ev.target.files[0];if(!f)return;
 const r=new FileReader();
 r.onload=()=>{try{const data=JSON.parse(r.result);
  if(!data.days||!data.settings)throw 0;
  state=data;save();toast('✅ Data imported');render();}
  catch(e){toast('❌ Import failed — invalid file');}};
 r.readAsText(f);}
function resetAll(){if(!confirm('Delete ALL data? This cannot be undone.'))return;
 if(!confirm('Really sure? Export a backup first if unsure.'))return;
 localStorage.removeItem(KEY);state=defaultState();schedDraft=null;getDay(todayStr());render();toast('🗑 All data reset');}

/* =====================================================================
   15. ROUTER, HEADER, NAV, INIT
===================================================================== */
const VIEWS={dashboard:viewDashboard,today:viewToday,dsa:viewDSA,java:viewJava,aws:viewAWS,
 aptitude:viewAptitude,corecs:viewCoreCS,projects:viewProjects,interview:viewInterview,
 communication:viewCommunication,revision:viewRevision,progress:viewProgress,settings:viewSettings};
let lastViewKey='';
function currentView(){const parts=(location.hash||'').replace(/^#\/?/,'').split('/');
 return{v:parts[0]||'today',sub:parts[1]||null};}
function navigate(v,sub){$('#sidebar').classList.remove('open');$('#overlay').classList.remove('show');
 const h='#/'+v+(sub?'/'+sub:'');
 if(location.hash===h)render();else location.hash=h;}
function toggleSidebar(){$('#sidebar').classList.toggle('open');$('#overlay').classList.toggle('show');}
function captureTransient(){const v=currentView().v;
 try{
  if(v==='revision'&&$('#rv-learned'))captureReview();
  if(v==='aptitude'&&$('#ap-quant-att'))captureAptitude();
  if(v==='communication'&&$('#sm-text'))smDraft=$('#sm-text').value;
 }catch(e){}}
function render(){captureTransient();
 const{v,sub}=currentView();const key=v+'/'+(sub||'');
 $('#view').innerHTML=(VIEWS[v]||VIEWS.today)(sub);
 renderHeader();renderNav();
 if(key!==lastViewKey){window.scrollTo(0,0);lastViewKey=key;}}
function renderHeader(){const{v}=currentView();
 $('#topbar-title').innerHTML=((VIEW_META[v]||VIEW_META.today)[1])+' <span class="tb-date">'+niceDate(todayStr())+'</span>';
 $('#tb-streak').innerHTML='🔥 '+currentStreak();
 $('#tb-timer').innerHTML=(state.timer.running?'⏸ ':'▶ ')+fmtSec(studySecondsToday());}
function renderNav(){const cur=currentView().v;
 $('#nav').innerHTML=NAV.map(([v,ic,nm])=>'<a class="navitem'+(cur===v?' active':'')+'" onclick="navigate(\''+v+'\')">'+ic+'<span>'+nm+'</span></a>').join('');
 $('#side-prog').innerHTML='Today: <b>'+dayStats(todayStr()).pct+'%</b> · 🔥 '+currentStreak()+'d · '+fmtSec(studySecondsToday());}
window.addEventListener('hashchange',render);
window.addEventListener('beforeunload',()=>{if(state.timer.running)flushTimer();save();});
/* periodic refresh: clock/session line, timer-day rollover */
setInterval(()=>{
 if(state.timer.running&&state.timer.date&&state.timer.date!==todayStr()){flushTimer();state.timer.date=todayStr();save();}
 const el=$('#now-line');if(el)el.innerHTML=nowLineHTML();
 renderHeader();
},60000);
/* init */
load();
getDay(todayStr());
if(!location.hash)location.hash='#/today';
render();
</script>
